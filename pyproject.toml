# Dev-only tool configuration (see docs/developer_guide.md, "Code style and
# documentation conventions"). The product itself has no Python dependencies;
# this file only configures the formatter that `tools/lint.sh` runs.

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true
# The existing code hugs a sole bracketed argument (`foo([` ... `])`), which
# is pyink's `hug_parens_with_braces_and_square_brackets` feature. The pyink
# CLI ignores `enable-unstable-feature`, so the whole unstable style is
# enabled instead. The version is pinned in tools/lint.sh and CI, and pyink
# still verifies that the reformatted AST is equivalent before writing.
unstable = true
